name: CI

# Only the trunk branches, plus any PR.
#
# Lane branches are rebased onto `dev` at every integration and force-pushed, so
# running on every push meant FIVE identical runs per cycle — dev plus four lane
# branches all sitting on the same commit — and five failure emails for one
# failure. A notification you receive five times is one you learn to delete.
#
# A lane still gets CI the moment it opens a pull request, which is the point at
# which its code differs from `dev` and the answer is worth having.
on:
  push:
    branches: [main, dev]
  pull_request:

# A force-push supersedes the run it interrupts. Without this, rebasing four
# lanes queues runs for commits nobody will ever look at again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # Mirrors api/.env.example. These are the compose stack's dev defaults, not
    # secrets — the database exists only for the length of this job. Anything
    # genuinely secret belongs in repository secrets, never here.
    env:
      DATABASE_URL: postgres://avo:avo_dev_password@localhost:5433/avo
      APP_DATABASE_URL: postgres://avo_app:avo_app_dev_password@localhost:5433/avo
      NODE_ENV: test
      GATEWAY_DRIVER: sandbox

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # Tokens are generated from design/tokens/avo-tokens.json. If the checked-in
      # output drifts from the source, someone hand-edited a generated file —
      # which is how a hex gets re-typed. CLAUDE.md: "never re-type a hex".
      - run: pnpm tokens
      - run: git diff --exit-code packages/tokens/src/generated.ts

      # The tenancy and gateway suites drive real Postgres, because a mock with
      # one salon cannot prove a salon boundary and a mock cannot exercise a
      # BEFORE UPDATE trigger. They shell out to `docker exec avo-postgres`, so
      # CI brings up the same compose stack a developer runs rather than a
      # services: block, whose container name would not match.
      # Build BEFORE anything that imports a workspace package at runtime.
      # db:seed imports @avo/types for the money helpers, and turbo's build graph
      # is not consulted by a bare `pnpm --filter ... run db:seed`. This is the
      # third failure of the same shape this session: a step that needs a build
      # artifact running before the build that makes it.
      - run: pnpm build

      - name: Start Postgres
        working-directory: api
        run: docker compose up -d --wait

      - run: pnpm --filter @avo/api run db:migrate
      - run: pnpm --filter @avo/api run db:seed

      # Nothing below may depend on a build artifact left over from a previous
      # run. CI checks out clean; a local tree does not, which is exactly how a
      # missing turbo dependency edge stayed invisible while every local run was
      # green on a stale packages/types/dist.
      - run: pnpm check

      - name: Postgres logs on failure
        if: failure()
        working-directory: api
        run: docker compose logs postgres | tail -50
