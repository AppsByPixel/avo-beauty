name: CI

# Only the trunk branches, plus any PR.
#
# Lane branches are rebased onto `dev` at every integration and force-pushed, so
# running on every push meant FIVE identical runs per cycle — dev plus four lane
# branches all sitting on the same commit — and five failure emails for one
# failure. A notification you receive five times is one you learn to delete.
#
# A lane still gets CI the moment it opens a pull request, which is the point at
# which its code differs from `dev` and the answer is worth having.
on:
  push:
    branches: [main, dev]
  pull_request:

# A force-push supersedes the run it interrupts. Without this, rebasing four
# lanes queues runs for commits nobody will ever look at again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # DELIBERATELY NO job-level DATABASE_URL.
    #
    # There used to be one, pointing at a shared `avo`. The e2e harness read it
    # and would have taken fixtures from one database while the API it booted
    # wrote to another. Lane D pinned the harness to its own database; removing
    # the variable removes the trap rather than working around it.
    #
    # Each step below that needs a database now names the one it means.
    env:
      NODE_ENV: test
      GATEWAY_DRIVER: sandbox

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # Tokens are generated from design/tokens/avo-tokens.json. If the checked-in
      # output drifts from the source, someone hand-edited a generated file —
      # which is how a hex gets re-typed. CLAUDE.md: "never re-type a hex".
      - run: pnpm tokens
      - run: git diff --exit-code packages/tokens/src/generated.ts

      # Build BEFORE anything that imports a workspace package at runtime, and
      # before the suites, which need the built types.
      - run: pnpm build

      # The compose stack, not a `services:` block — the e2e harness shells out
      # to `docker exec avo-postgres` by name, and a service container would not
      # match it.
      - name: Start Postgres
        working-directory: api
        run: docker compose up -d --wait

      # A MIGRATION SMOKE TEST, not setup for the suites.
      #
      # This is worth its own step because it caught a real bug: `seed.ts`
      # inserted artists before the staff users they referenced, which worked on
      # every warm database and failed only on an empty one. CI was the only
      # place an empty one existed.
      #
      # It runs against a throwaway database of its own so nothing downstream can
      # accidentally depend on the rows it leaves behind.
      - name: Migrations and seed apply to an empty database
        working-directory: api
        env:
          DATABASE_URL: postgres://avo:avo_dev_password@localhost:5433/avo_migrate_check
          APP_DATABASE_URL: postgres://avo_app:avo_app_dev_password@localhost:5433/avo_migrate_check
        run: |
          docker exec -i avo-postgres psql -U avo -d postgres \
            -c "CREATE DATABASE avo_migrate_check OWNER avo;"
          pnpm run db:migrate
          pnpm run db:seed

      # The suites mint their own per-run database in global-setup and drop it in
      # teardown. Do NOT set POSTGRES_DB here: global-setup.ts skips the minting
      # when it sees one, which silently puts every concurrent checkout back on
      # the same fixtures — the bug that produced four different failure counts
      # on one unchanged tree.
      - run: pnpm check

      - name: Postgres logs on failure
        if: failure()
        working-directory: api
        run: docker compose logs postgres | tail -50
