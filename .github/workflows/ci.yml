name: CI

# Only the trunk branches, plus any PR.
#
# Lane branches are rebased onto `dev` at every integration and force-pushed, so
# running on every push meant FIVE identical runs per cycle — dev plus four lane
# branches all sitting on the same commit — and five failure emails for one
# failure. A notification you receive five times is one you learn to delete.
#
# A lane still gets CI the moment it opens a pull request, which is the point at
# which its code differs from `dev` and the answer is worth having.
on:
  push:
    branches: [main, dev]
  pull_request:

# A force-push supersedes the run it interrupts. Without this, rebasing four
# lanes queues runs for commits nobody will ever look at again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    # DELIBERATELY NO job-level DATABASE_URL.
    #
    # There used to be one, pointing at a shared `avo`. The e2e harness read it
    # and would have taken fixtures from one database while the API it booted
    # wrote to another. Lane D pinned the harness to its own database; removing
    # the variable removes the trap rather than working around it.
    #
    # Each step below that needs a database now names the one it means.
    env:
      NODE_ENV: test
      GATEWAY_DRIVER: sandbox

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }

      - run: pnpm install --frozen-lockfile

      # Tokens are generated from design/tokens/avo-tokens.json. If the checked-in
      # output drifts from the source, someone hand-edited a generated file —
      # which is how a hex gets re-typed. CLAUDE.md: "never re-type a hex".
      - run: pnpm tokens
      - run: git diff --exit-code packages/tokens/src/generated.ts

      # Build BEFORE anything that imports a workspace package at runtime, and
      # before the suites, which need the built types.
      - run: pnpm build

      # The compose stack, not a `services:` block — the e2e harness shells out
      # to `docker exec avo-postgres` by name, and a service container would not
      # match it.
      - name: Start Postgres
        working-directory: api
        run: docker compose up -d --wait

      # A MIGRATION SMOKE TEST, not setup for the suites.
      #
      # This is worth its own step because it caught a real bug: `seed.ts`
      # inserted artists before the staff users they referenced, which worked on
      # every warm database and failed only on an empty one. CI was the only
      # place an empty one existed.
      #
      # It runs against a throwaway database of its own so nothing downstream can
      # accidentally depend on the rows it leaves behind.
      - name: Migrations and seed apply to an empty database
        working-directory: api
        env:
          DATABASE_URL: postgres://avo:avo_dev_password@localhost:5433/avo_migrate_check
          APP_DATABASE_URL: postgres://avo_app:avo_app_dev_password@localhost:5433/avo_migrate_check
        run: |
          docker exec -i avo-postgres psql -U avo -d postgres \
            -c "CREATE DATABASE avo_migrate_check OWNER avo;"
          pnpm run db:migrate
          pnpm run db:seed

      # THE DATABASE GUARANTEES, ASSERTED RATHER THAN DESCRIBED.
      #
      # `verify-constraints.sql` proves 42 invariants the schema claims: money is
      # bigint fils with no float-family column anywhere (#1), a negative balance
      # is impossible, the append-only tables refuse UPDATE/DELETE/TRUNCATE, every
      # wallet reconciles to its ledger, and a settled top-up cannot leave its
      # terminal state.
      #
      # WHY THIS STEP EXISTS AT ALL: for its whole life the script was run by
      # nobody. Ten sections of assertions were exactly what the prose invariants
      # they replaced had been — true, unread, unenforced. Three separate false
      # claims had already been found in comments that nothing checked (the ledger
      # reconciliation, migration 0020's "same treatment as audit_log", and 0021's
      # restrict-on-delete argument), which is the case for gating rather than
      # trusting.
      #
      # It runs against `avo_migrate_check` — the throwaway the step above just
      # seeded — and not against a database anyone cares about. That is not
      # fastidiousness: until `76f0833` the script committed its probes, so on a
      # database missing a guarantee it would TRUNCATE the money ledger for real
      # while demonstrating that it could. It now runs every probe inside a
      # subtransaction and ends in ROLLBACK, and asserts its own
      # non-destructiveness. Verified here before wiring it in: exit 0 with 42/42
      # on a clean database and row counts unchanged, exit 3 naming the failure
      # with a trigger dropped — and the ledger still intact in that run.
      - name: Database invariants hold on a freshly seeded database
        working-directory: api
        env:
          AVO_VERIFY_DB: avo_migrate_check
        run: pnpm run db:verify

      # THE INTEGRATION SUITES, WHICH RAN NOWHERE UNTIL 2026-09-10.
      #
      # `pnpm check` is `turbo run typecheck lint test`, and `api`'s `test` is a
      # bare `vitest run` against a config that EXCLUDES `**/*.int.test.ts` — on
      # purpose, and `vitest.config.ts:85` argues why: an int spec needs a real
      # database and must not run in a unit sweep. But nothing ever ran the other
      # half. Twenty-one files, every one green by never executing, and among them
      # the only proofs that a charge is atomic, a wallet token is single-use, a
      # deposit applies once, a voucher claims once, and an erasure reaches a
      # customer's address. Decision 101, and the third of its family after 76
      # (`check` reports a lint pass it never ran) and 89 (the typecheck did not
      # read the specs — RESOLVED the same day this step landed: `api/` was the
      # last package excluding them, and the two drifts it was hiding were a
      # fixture missing a NOT NULL column and one asserting a platform role the
      # database's own CHECK refuses to store. 76 is the last one still open).
      #
      # ITS OWN DATABASE, NOT `avo_migrate_check`. The verify step above runs 93
      # invariants against that one, and several int fixtures leave rows behind by
      # design — so sharing would make the STEP ORDER load-bearing and undocumented,
      # and a future reorder would produce an invariant failure with no visible
      # cause. A second throwaway costs one `CREATE DATABASE`.
      #
      # CONNECTED AS `avo_app`, NOT THE OWNER, and that is the whole point of these
      # suites: `vitest.int.config.ts` sets both URLs from this one variable
      # because, in its words, "a limiter proved under the owner role is a limiter
      # proved against privileges production does not have". The REVOKEs are what
      # several of these specs assert.
      #
      # `AVO_INT_DATABASE_URL` unset is a SKIP rather than a failure — every spec
      # checks the variable itself and never imports the app. So the step that
      # proves this step works is the run where the count is non-zero: if this
      # ever reports "no tests", the variable stopped reaching them and the
      # suites are silently green again, which is exactly the state it exists to
      # end.
      - name: Integration suites against a real database as the app role
        working-directory: api
        env:
          AVO_INT_DATABASE_URL: postgres://avo_app:avo_app_dev_password@localhost:5433/avo_int_check
        run: |
          docker exec -i avo-postgres psql -U avo -d postgres \
            -c "CREATE DATABASE avo_int_check OWNER avo;"
          DATABASE_URL=postgres://avo:avo_dev_password@localhost:5433/avo_int_check \
          APP_DATABASE_URL=postgres://avo_app:avo_app_dev_password@localhost:5433/avo_int_check \
            pnpm run db:migrate
          DATABASE_URL=postgres://avo:avo_dev_password@localhost:5433/avo_int_check \
          APP_DATABASE_URL=postgres://avo_app:avo_app_dev_password@localhost:5433/avo_int_check \
            pnpm run db:seed
          pnpm run test:int 2>&1 | tee /tmp/int.log

          # THE GUARD, because this step can otherwise pass having run nothing.
          #
          # `test:int` carries `--passWithNoTests`, and an unset or unreachable
          # `AVO_INT_DATABASE_URL` makes the specs SKIP rather than fail — by
          # design, so a developer without a database is not blocked. Both paths
          # exit 0. So a typo in the variable above, or a rename of the include
          # glob, would return this step to precisely the silent green decision
          # 101 records.
          #
          # IT ASSERTS A PROPERTY, NOT A COUNT, and the difference was measured
          # rather than reasoned. The first version of this guard required at
          # least one passing spec — useless, because with the variable unset a
          # DOZEN-ODD still pass (they need no database) while the rest skip. A
          # floor of one never fires; a floor of the current total goes stale on
          # the next slice, which is the defect DECISIONS.md row 26 is about —
          # and it went stale immediately, the same day: 346 became 350 when
          # `erasedMemberContact.int.test.ts` landed. That is why no count
          # appears in this comment either.
          #
          # What actually separates the two states is that a properly configured
          # run skips NOTHING:
          #
          #   reachable:    Tests  <all> passed (<all>)
          #   unreachable:  Tests  <a few> passed | <the rest> skipped (<all>)
          #
          # So: any skip here means the database did not reach the suites. That
          # holds whatever the count grows to, and it fails in both directions —
          # it catches the suites vanishing as well as breaking.
          if grep -qE '^ +(Tests|Test Files) .*skipped' /tmp/int.log; then
            grep -E '^ +(Tests|Test Files) ' /tmp/int.log >&2
            echo "::error::Integration specs SKIPPED. AVO_INT_DATABASE_URL is not reaching them, so these suites are green without running — see DECISIONS.md 101." >&2
            exit 1
          fi
          grep -E '^ +Tests ' /tmp/int.log

      # The suites mint their own per-run database in global-setup and drop it in
      # teardown. Do NOT set POSTGRES_DB here: global-setup.ts skips the minting
      # when it sees one, which silently puts every concurrent checkout back on
      # the same fixtures — the bug that produced four different failure counts
      # on one unchanged tree.
      - run: pnpm check

      - name: Postgres logs on failure
        if: failure()
        working-directory: api
        run: docker compose logs postgres | tail -50
