name: CI
on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens
      # Fails the build if the generated tokens drift from avo-tokens.json —
      # the enforcement behind "never re-type a hex".
      - run: git diff --exit-code packages/tokens/src/generated.ts
      - run: pnpm check
